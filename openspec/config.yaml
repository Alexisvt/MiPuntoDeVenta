schema: spec-driven

context: |
  Stack: React 19.2, Next.js 16.3 App Router and TanStack Query v5 frontend; Spring Boot 4.1 Java 25 API; PostgreSQL on Amazon RDS
  Architecture: modular monolith with REST API; Next.js static export served via S3/CloudFront
  Deployment: Spring Boot container on ECS Fargate behind an ALB; frontend compute deferred
  Testing: Maven/JUnit for backend; Vitest, React Testing Library, Playwright and axe for frontend

strict_tdd: true

rules:
  specs:
    - Use Given/When/Then format and RFC 2119 keywords
  design:
    - Document architecture decisions and rationale
  tasks:
    - Group work by phase and keep tasks session-sized
