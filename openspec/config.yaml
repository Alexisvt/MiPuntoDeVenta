schema: spec-driven

context: |
  Stack: Angular 22 frontend, Spring Boot 4.1 Java 25 API, PostgreSQL on Amazon RDS
  Architecture: modular monolith with REST API; Angular static site served via S3/CloudFront
  Deployment: Spring Boot container on ECS Fargate behind an ALB
  Testing: Maven/JUnit for backend; Angular test runner and Playwright for frontend

strict_tdd: true

rules:
  specs:
    - Use Given/When/Then format and RFC 2119 keywords
  design:
    - Document architecture decisions and rationale
  tasks:
    - Group work by phase and keep tasks session-sized
