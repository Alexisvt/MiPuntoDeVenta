name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Approved issue and type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const typeLabels = pr.labels
              .map(({ name }) => name)
              .filter((name) => name.startsWith('type:'));

            if (typeLabels.length !== 1) {
              core.setFailed(`Expected exactly one type:* label; found ${typeLabels.length}.`);
              return;
            }

            const reference = pr.body?.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!reference) {
              core.setFailed('PR body must contain Closes #N, Fixes #N or Resolves #N.');
              return;
            }

            const issueNumber = Number(reference[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const issueLabels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name,
            );

            if (!issueLabels.includes('status:approved')) {
              core.setFailed(`Issue #${issueNumber} does not have status:approved.`);
            }
