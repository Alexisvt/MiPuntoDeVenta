spring:
  application:
    name: mipuntodeventa
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mipuntodeventa}
    username: ${DATABASE_USERNAME:mipuntodeventa}
    password: ${DATABASE_PASSWORD:mipuntodeventa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
